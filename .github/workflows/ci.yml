name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install "poetry>=2,<3"

      - name: Cache virtualenv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py3.12-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        run: |
          poetry config virtualenvs.in-project true
          poetry install --no-interaction

      - name: Lint
        run: poetry run ruff check .

      - name: Check formatting
        run: poetry run ruff format --check .

      - name: Type check
        run: poetry run mypy

      # Normal tests only: fakes for WhatsApp and the LLM, no secrets, same result every run.
      # The real-model evaluation set (-m eval) runs in a separate, manual workflow later.
      - name: Test
        run: poetry run pytest -m "not eval" --cov --cov-report=term-missing
